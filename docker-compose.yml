version: '3.8'

services:
  app:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
      environment:
        - NODE_ENV=production
        - DATABASE_URL=postgresql://postgres:postgres@db:5432/social_impression
        - SESSION_SECRET=local-dev-secret-key-32-characters-min
        - WEBHOOK_SECRET=local-webhook-secret-32-chars-min
        - APP_URL=http://localhost:3000
        - NEXT_TELEMETRY_DISABLED=1
      depends_on:
        db:
          condition: service_healthy
      restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=social_impression
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: