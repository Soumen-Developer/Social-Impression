# Render.com deployment configuration for Social Impression
# This file defines the services, databases, and environment variables

services:
  # Web service - Next.js application
  - type: web
    name: social-impression-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      # Database URL will be injected from the database service
      - key: DATABASE_URL
        fromDatabase:
          name: social-impression-db
          property: connectionString
      - key: DATABASE_PROVIDER
        value: "postgresql"
      # Session secret - generate a secure random string
      - key: SESSION_SECRET
        generateValue: true
      # Webhook secret for payment integrations
      - key: WEBHOOK_SECRET
        generateValue: true
      # Application URL - will be set after first deploy
      - key: APP_URL
        value: "https://social-impression-web.onrender.com"
      # Email configuration (configure with your provider)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Payment gateway keys (Razorpay/Stripe)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Social auth providers
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # Background worker for async tasks (emails, webhooks, etc.)
  - type: worker
    name: social-impression-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: social-impression-db
          property: connectionString
      - key: DATABASE_PROVIDER
        value: "postgresql"
      - key: SESSION_SECRET
        fromService:
          name: social-impression-web
          property: envVars.SESSION_SECRET
      - key: WEBHOOK_SECRET
        fromService:
          name: social-impression-web
          property: envVars.WEBHOOK_SECRET
      - key: APP_URL
        fromService:
          name: social-impression-web
          property: envVars.APP_URL

databases:
  # PostgreSQL database for production
  - name: social-impression-db
    databaseName: social_impression
    user: social_impression
    plan: starter
    region: singapore
    postgresMajorVersion: 16

# Optional: Redis for caching and sessions
# Uncomment if you need Redis
# redis:
#   - name: social-impression-redis
#     plan: starter
#     region: singapore
#     maxmemoryPolicy: allkeys-lru

# Cron jobs for scheduled tasks
cronJobs:
  - name: daily-maintenance
    schedule: "0 3 * * *" # 3 AM daily
    command: "npx tsx scripts/maintenance.ts"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: social-impression-db
          property: connectionString
      - key: DATABASE_PROVIDER
        value: "postgresql"
      - key: SESSION_SECRET
        fromService:
          name: social-impression-web
          property: envVars.SESSION_SECRET
      - key: APP_URL
        fromService:
          name: social-impression-web
          property: envVars.APP_URL

  - name: weekly-reports
    schedule: "0 9 * * 1" # Monday 9 AM
    command: "npx tsx scripts/weekly-reports.ts"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: social-impression-db
          property: connectionString
      - key: DATABASE_PROVIDER
        value: "postgresql"
      - key: SESSION_SECRET
        fromService:
          name: social-impression-web
          property: envVars.SESSION_SECRET
      - key: APP_URL
        fromService:
          name: social-impression-web
          property: envVars.APP_URL